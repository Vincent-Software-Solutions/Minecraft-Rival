plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
}

base {
    archivesName = 'RivalMod-unobfuscated'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

minecraft {
    mappings channel: 'official', version: rootProject.minecraft_version

    runs {
        client {
            workingDirectory project.file('run-client')
            property 'forge.logging.console.level', 'info'
            mods { minecraft_rival { source sourceSets.main } }
        }
    }
}

configurations { proguard }

dependencies {
    minecraft "net.neoforged:forge:${rootProject.minecraft_version}-${rootProject.neoforge_client_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    proguard 'com.guardsquare:proguard-base:7.9.1'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test { useJUnitPlatform() }

mixin {
    add sourceSets.main, 'minecraft_rival.refmap.json'
    config 'minecraft_rival.mixins.json'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', rootProject.minecraft_version
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version, minecraft_version: rootProject.minecraft_version)
    }
}

jar {
    manifest.attributes([
        'Specification-Title': 'Minecraft Rival',
        'Specification-Vendor': 'Vincent Software Solutions',
        'Specification-Version': project.version,
        'Implementation-Title': project.name,
        'Implementation-Version': project.version,
        'Implementation-Vendor': 'Vincent Software Solutions'
    ])
    finalizedBy 'reobfJar'
}

tasks.register('obfuscateRelease', JavaExec) {
    group = 'build'
    description = 'Erzeugt die zusätzlich verschleierte NeoForge-kompatible Release-Mod.'
    dependsOn 'reobfJar'
    classpath = configurations.proguard
    mainClass = 'proguard.ProGuard'
    doFirst {
        def input = tasks.jar.archiveFile.get().asFile
        def output = layout.buildDirectory.file("libs/RivalMod-${project.version}.jar").get().asFile
        args '@proguard.pro', '-injars', input.absolutePath, '-outjars', output.absolutePath
    }
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Prüft, dass alle Mixin-Einstiegsklassen die Verschlüsselung überleben.'
    dependsOn 'obfuscateRelease'
    doLast {
        def releaseJar = layout.buildDirectory.file("libs/RivalMod-${project.version}.jar").get().asFile
        def mixinConfig = new groovy.json.JsonSlurper().parseText(
            zipTree(releaseJar).matching { include 'minecraft_rival.mixins.json' }.singleFile.text)
        def entries = (mixinConfig.mixins ?: []) + (mixinConfig.client ?: []) + (mixinConfig.server ?: [])
        entries.each { name ->
            def path = "${mixinConfig.package.replace('.', '/')}/${name}.class"
            if (zipTree(releaseJar).matching { include path }.isEmpty())
                throw new GradleException("Release-Mixin fehlt nach Verschlüsselung: ${path}")
        }
    }
}

tasks.named('build') { dependsOn 'verifyReleaseJar' }
