plugins {
    id 'java'
}

repositories {
    maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
    maven { url = 'https://repo.extendedclip.com/releases/' }
}

dependencies {
    // Mohist 1.20.1 implements the Bukkit/Spigot surface, but not every Paper API
    // convenience overload. Compiling against Spigot prevents incompatible calls
    // such as Inventory#getHolder(false) from reaching the release jar.
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'me.clip:placeholderapi:2.11.7'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

test { useJUnitPlatform() }

jar {
    archiveBaseName = 'RivalPlugins'
}
